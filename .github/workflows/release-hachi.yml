name: Release Hachi

on:
  push:
    branches:
      - main
    tags:
      - "hachi-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Hachi release tag, for example hachi-v3.3.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-hachi:
    name: Release Hachi
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || github.ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Resolve Hachi release tag
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          $expectedTag = "hachi-v$version"

          if ($env:INPUT_TAG) {
            if ($env:REF_TYPE -ne "branch" -or $env:REF_NAME -ne "main") {
              Write-Error "Manual Hachi releases must run from main."
              exit 1
            }
            $tag = $env:INPUT_TAG
          } elseif ($env:REF_TYPE -eq "tag") {
            $tag = $env:REF_NAME
          } else {
            $tag = $expectedTag
          }

          node scripts/validateReleaseMetadata.js $tag
          if ($LASTEXITCODE -ne 0) {
            exit 1
          }

          $headCommit = (git rev-parse HEAD).Trim()
          $existingTagCommit = git rev-list -n 1 "refs/tags/$tag" 2>$null
          $tagExists = $LASTEXITCODE -eq 0 -and [bool]$existingTagCommit
          $shouldRelease = "true"
          if ($env:EVENT_NAME -eq "push" -and $env:REF_TYPE -eq "branch") {
            if (-not $env:BEFORE_SHA -or $env:BEFORE_SHA -match "^0+$") {
              Write-Error "Cannot verify the previous package version for an automatic release."
              exit 1
            }
            $previousPackageText = git show "$($env:BEFORE_SHA)`:package.json" 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $previousPackageText) {
              Write-Error "Cannot read the previous package version."
              exit 1
            }
            $previousVersion = [string](($previousPackageText | ConvertFrom-Json).version)
            if ($previousVersion -eq $version -or $tagExists) {
              Write-Host "No new Hachi version to release from this main push."
              $shouldRelease = "false"
            }
          }

          if ($env:REF_TYPE -eq "tag" -and -not $tagExists) {
            Write-Error "The pushed release tag was not found in this checkout."
            exit 1
          }
          if ($shouldRelease -eq "true" -and $tagExists -and $existingTagCommit.Trim() -ne $headCommit) {
            Write-Error "Release tag $tag points to a different commit than this checkout."
            exit 1
          }

          $createTag = if ($shouldRelease -eq "true" -and -not $tagExists) { "true" } else { "false" }
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "release_title=Hachi v$version" >> $env:GITHUB_OUTPUT
          "release_version=$version" >> $env:GITHUB_OUTPUT
          "should_release=$shouldRelease" >> $env:GITHUB_OUTPUT
          "create_tag=$createTag" >> $env:GITHUB_OUTPUT
          Write-Host "release_tag=$tag"
          Write-Host "release_title=Hachi v$version"
          Write-Host "should_release=$shouldRelease"
          exit 0

      - name: Install dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci

      - name: Create CI config
        if: steps.release.outputs.should_release == 'true'
        run: node -e "const fs = require('fs'); const config = require('./config/blank.json'); config.botOwners = ['111111111111111111']; config.guildIds = ['222222222222222222']; fs.writeFileSync('config/config.json', JSON.stringify(config, null, '\t') + '\n');"

      - name: Verify release
        if: steps.release.outputs.should_release == 'true'
        env:
          HACHI_DB_ENCRYPTION: encrypted
          HACHI_DB_KEY: smoke-db-key
          HACHI_SECRETS_ENCRYPTION: encrypted
          HACHI_SECRETS_KEY: smoke-secret-key
          TOKEN: smoke-token
          clientId: smoke-client-id
          kickClientId: smoke-kick-client-id
          kickSecret: smoke-kick-secret
          twitchClientId: smoke-twitch-client-id
          twitchSecret: smoke-twitch-secret
        run: |
          npm run check
          npm run lint
          npm run smoke
          npm audit --audit-level=moderate

      - name: Create Hachi release tag
        if: steps.release.outputs.create_tag == 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $env:RELEASE_TAG
          git push origin $env:RELEASE_TAG

      - name: Create GitHub release
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
        run: |
          $tag = $env:RELEASE_TAG

          if (-not $tag) {
            Write-Error "Release tag was not provided."
            exit 1
          }

          gh release view $tag *> $null

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists."
            exit 0
          }

          gh release create $tag --title "$env:RELEASE_TITLE" --generate-notes --latest
          exit $LASTEXITCODE
